[project]
name = "requirements-review-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "mcp[cli]>=2.1,<3",
  "pydantic>=2.11,<3",
  "pymupdf>=1.28,<1.29",
  "python-docx>=1.2,<2",
  "pyyaml>=6.0,<7",
]

[project.scripts]
requirements-review-mcp = "requirements_review_agent.server:main"
rra = "requirements_review_agent.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["requirements_review_agent"]
